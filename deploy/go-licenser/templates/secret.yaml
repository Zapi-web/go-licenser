apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-licenser.fullname" . }}-secret
  labels:
    {{- include "go-licenser.labels" . | nindent 4 }}
type: Opaque
stringData:
  ED25519_PRIVATE_KEY: {{ required "secret.ED25519_PRIVATE_KEY is required: pass it with --set or a private values file" .Values.secret.ED25519_PRIVATE_KEY | quote }}
  ADMIN_TOKEN: {{ required "secret.ADMIN_TOKEN is required: pass it with --set or a private values file" .Values.secret.ADMIN_TOKEN | quote }}
  CONNECTION_STRING: {{ required "secret.CONNECTION_STRING is required: pass it with --set or a private values file" .Values.secret.CONNECTION_STRING | quote }}
