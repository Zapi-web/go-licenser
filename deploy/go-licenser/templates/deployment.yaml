apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-licenser.fullname" . }}
  labels:
    {{- include "go-licenser.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "go-licenser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "go-licenser.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            # internal/config: AppConfig
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: ED25519_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-licenser.fullname" . }}-secret
                  key: ED25519_PRIVATE_KEY
            - name: VERSION
              value: {{ .Values.env.VERSION | quote }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-licenser.fullname" . }}-secret
                  key: ADMIN_TOKEN
            - name: KEY_GROUPS
              value: {{ .Values.env.KEY_GROUPS | quote }}
            - name: KEY_GROUPS_LEN
              value: {{ .Values.env.KEY_GROUPS_LEN | quote }}
            - name: TOKEN_TTL
              value: {{ .Values.env.TOKEN_TTL | quote }}
            # internal/config: DatabaseConfig
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-licenser.fullname" . }}-secret
                  key: CONNECTION_STRING
            - name: MAX_CONNS
              value: {{ .Values.env.MAX_CONNS | quote }}
            - name: MIN_CONNS
              value: {{ .Values.env.MIN_CONNS | quote }}
            - name: MAX_CONN_LIFETIME
              value: {{ .Values.env.MAX_CONN_LIFETIME | quote }}
            - name: MAX_CONN_IDLETIME
              value: {{ .Values.env.MAX_CONN_IDLETIME | quote }}
            - name: HEALTH_CHECK_PERIOD
              value: {{ .Values.env.HEALTH_CHECK_PERIOD | quote }}
            - name: CONNECTION_TIMEOUT
              value: {{ .Values.env.CONNECTION_TIMEOUT | quote }}
            # internal/config: ServerConfig
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HTTP_READ_TIMEOUT
              value: {{ .Values.env.HTTP_READ_TIMEOUT | quote }}
            - name: HTTP_WRITE_TIMEOUT
              value: {{ .Values.env.HTTP_WRITE_TIMEOUT | quote }}
            - name: SERVER_SHUTDOWN_TIMEOUT
              value: {{ .Values.env.SERVER_SHUTDOWN_TIMEOUT | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532 
            capabilities:
              drop:
                - ALL
