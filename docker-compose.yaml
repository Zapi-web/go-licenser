services:
  go:
    build: .
    ports:
      - "8080:8080"
    container_name: licenser-test
    environment:
      - PORT=8080
      - LOG_LEVEL=debug
      - CONNECTION_STRING=postgres://postgres:${POSTGRES_PASSWORD:?set it in .env}@db:5432/postgres?sslmode=disable
      - ED25519_PRIVATE_KEY=${ED25519_PRIVATE_KEY:?set it in .env}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set it in .env}
      - VERSION=1
    depends_on:
          db:
            condition: service_healthy
          goose:
            condition: service_completed_successfully

  goose:
      image: kukymbr/goose-docker:3.26.0
      environment:
        - GOOSE_DRIVER=postgres
        - GOOSE_DBSTRING=postgres://postgres:${POSTGRES_PASSWORD:?set it in .env}@db:5432/postgres?sslmode=disable
      volumes:
        - ./deploy/app/migrations:/migrations
      depends_on:
        db:
          condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: postgres-test
    environment:
      - POSTGRES_USER=licenser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set it in .env}
      - POSTGRES_DB=licenser
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licenser"]
      interval: 3s
      timeout: 3s
      retries: 5
