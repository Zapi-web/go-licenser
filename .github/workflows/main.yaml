name: Main Pipeline

on:
    push:
        branches: [ main ]
        paths-ignore:
            - README.md
            - LICENSE
    pull_request:
        branches: [ main ]
        paths-ignore:
            - README.md
            - LICENSE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    checks:
        uses: ./.github/workflows/go.yaml
