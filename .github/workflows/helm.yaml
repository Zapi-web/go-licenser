name: Helm Test and Push

on:
  workflow_call:

env:
  CHART_DIR: deploy/go-licenser

jobs:
  lint-test:
    name: Lint & render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: |
          set -euo pipefail
          VALUES="$CHART_DIR/ci/test-values.yaml"
          helm lint --strict "$CHART_DIR" -f "$VALUES"
          helm lint --strict "$CHART_DIR" -f "$VALUES" --set migrations.enabled=true

      - name: Render templates
        run: |
          set -euo pipefail
          VALUES="$CHART_DIR/ci/test-values.yaml"
          helm template test-release "$CHART_DIR" -f "$VALUES" > /dev/null
          helm template test-release "$CHART_DIR" -f "$VALUES" --set migrations.enabled=true > /dev/null

  push:
    name: Package & push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-test
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: helm-push-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Login to GHCR
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$HELM_REGISTRY_PASSWORD" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$REF_NAME' is not full semver (vX.Y.Z)"
            exit 1
          fi

          CHART_NAME=$(helm show chart "$CHART_DIR" | awk '/^name:/{print $2; exit}')
          REGISTRY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/${CHART_NAME}-${VERSION}.tgz" "oci://ghcr.io/${REGISTRY_OWNER}/charts"
