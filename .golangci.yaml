version: "2"

formatters:
  enable:
    - gofmt
    - gci

  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/zapi-web/go-licenser)

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - revive
    - thelper
    - mirror
    - usestdlibvars
    - misspell
    - dupword
    - loggercheck
    - exptostd
    - fatcontext
    - usetesting

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    misspell:
      locale: US

output:
  sort-order:
    - linter
    - severity
    - file
